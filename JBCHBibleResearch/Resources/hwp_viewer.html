<!DOCTYPE html>
<!--
  hwp_viewer.html
  JBCHBibleResearch

  [2026-08-16 재도입] 사용자 요청 — hwp-swift 네이티브 뷰어(DocumentViewerView.swift의
  HWPViewerPane)만으로는 렌더링이 rhwp-studio(https://edwardkim.github.io/rhwp/) 온라인
  데모만큼 완전하지 않다는 지적을 받아, rhwp(https://github.com/edwardkim/rhwp,
  Rust+WebAssembly, MIT)를 WKWebView에 다시 번들해 "두 번째 뷰어"로 나란히 추가한다 —
  사용자가 같은 문서를 두 뷰어로 각각 열어 렌더링 완전성을 직접 비교해 볼 수 있게 하는
  것이 목적이다(HWPViewerModeToggle, DocumentViewerView.swift 참고).

  이번 세션 초반에 이미 한 번 이 방식(rhwp WASM + WKWebView)을 시도했다가, 실기기에서
  WebContent 프로세스가 App Sandbox 안에서 계속 실패해(HWPWebViewSupport.swift 참고)
  hwp-swift(순수 네이티브 Swift)로 전면 교체했었다. 이번엔 "교체"가 아니라 "추가"라
  그 옛 코드를 그대로 되살리되, 렌더링 엔진 선택만 바꿨다 — 이전엔 `renderPageSvg`
  (README가 "Legacy SVG — 기본 호환 출력"이라 부르는 경로)를 썼는데, 이번엔
  `renderPageToCanvas`(README의 "Browser/native Canvas paths render through
  PageLayerTree replay by default" — rhwp-studio 자신이 화면에 실제로 쓰는 최신
  경로)를 쓴다. rhwp.d.ts 주석: "특정 페이지를 Canvas 2D에 직접 렌더링한다... Canvas
  크기는 페이지 크기 × scale로 설정된다" — 즉 캔버스 크기를 우리가 미리 계산할 필요
  없이 이 함수가 알아서 설정해 준다.

  golbin/hop(Tauri 데스크톱 앱, https://github.com/golbin/hop)도 rhwp-studio를
  그대로 얹어 쓴다는 걸 확인했다 — Tauri의 macOS 백엔드도 결국 WKWebView라, "WKWebView +
  rhwp가 macOS에서 근본적으로 안 되는 조합"은 아니라는 근거가 된다(이전 실패가
  이 앱의 특정 설정/상태 문제였을 가능성이 높다는 뜻).

  ⚠️ `@rhwp/editor`(완전한 에디터 iframe 임베드, "3줄 임베드")는 일부러 안 썼다 —
  `EditorOptions.studioUrl`이 "file:, data:, browser extension 등 opaque origin은
  지원하지 않음"이라고 문서에 명시돼 있어, 우리 커스텀 스킴(`hwpviewer://`)이나 로컬
  번들로는 그 iframe을 못 띄운다(실제 http(s) 서버가 필요) — 오프라인 동작과 개인
  문서를 외부 서버에 의존하지 않는다는 원칙에 맞지 않아 그 경로는 배제했다. 대신
  `@rhwp/core`(WASM API 직접 호출)만 쓴다 — rhwp-studio가 화면에 그리는 것과 같은
  렌더링 함수(`renderPageToCanvas`)를 우리가 직접 호출하므로 렌더링 결과물의 완전성은
  동일해야 한다(에디터 UI 크롬만 없을 뿐).

  파일 구성(모두 Resources/ 바로 아래, 하위 폴더 없이 평평하게 — 상대 경로
  import/fetch가 항상 "같은 폴더의 형제 파일"을 가리키게 하기 위해서다):
  - rhwp.js / rhwp_bg.wasm — npm 패키지(@rhwp/core 0.8.4) 원본, 수정 없이 그대로 복사
  - rhwp_LICENSE.txt — 위 두 파일의 MIT 라이선스 원문
  - hwp_viewer.html(이 파일) / hwp_viewer.js — 이 프로젝트가 직접 작성한 최소 호스트
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>HWP 뷰어 (rhwp)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #e5e5e5;
    }
    /* [2026-08-16 변경] 사용자 요청 — "전체페이지가 다 나올 수 있도록." 캔버스
       하나에 현재 페이지만 그리던 것을, pdf 뷰어처럼 모든 페이지를 세로로
       이어붙여 스크롤로 보는 방식으로 바꿨다(hwp_viewer.js의 renderAllPages
       참고) — 그래서 컨테이너를 세로 flex 컬럼으로, 페이지 사이 간격을
       gap으로 준다. */
    #hwp-page-container {
      width: 100%;
      height: 100%;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-sizing: border-box;
      padding: 16px;
    }
    /* [2026-08-16 수정] "확대/축소가 안 됨" 버그 — `hwp_viewer.js`가 매 줌마다
       캔버스에 정확한 `style.width`/`style.height`(실제 표시 크기)를 인라인으로
       계산해서 넣어 주는데, 여기 `max-width: 100%; height: auto;`가 그 값을
       컨테이너 너비 이하로 강제로 다시 눌러 버리고 있었다 — 그래서 페이지
       너비가 컨테이너보다 넓어지는 순간(대부분의 실제 문서·확대 상태)부터는
       줌 배율을 바꿔도 항상 "컨테이너에 꽉 채운 너비"로만 보여 차이가 안
       느껴졌다. 인라인 스타일이 항상 정확한 크기이므로 여기서 다시 제한할
       필요가 없다 — 컨테이너의 `overflow: auto`가 필요할 때 가로/세로 스크롤을
       만들어 준다. */
    .hwp-page-canvas {
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      display: block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <!-- hwp_viewer.js가 문서를 열 때 페이지 수만큼 .hwp-page-canvas를 만들어
       이 컨테이너에 순서대로 채운다(renderAllPages 참고) — 정적 <canvas>를
       미리 두지 않는다. -->
  <div id="hwp-page-container"></div>
  <!--
    [2026-08-16 재도입] 이전 라운드에서 겪은 "JavaScript 예외가 발생했습니다"라는
    일반 문구 대신, 브라우저의 실제 에러(모듈 로딩 실패, wasm init 실패 등)를
    Swift로 그대로 실어 나르는 디버그 채널 — HWPWebViewSupport.swift의
    HWPDebugMessageHandler가 받는다. 모듈 스크립트(hwp_viewer.js) 로딩 자체가
    실패해도 이 인라인 스크립트는 영향받지 않는다.
  -->
  <script>
    function postHwpDebug(text) {
      try {
        window.webkit.messageHandlers.hwpDebug.postMessage(String(text));
      } catch (e) {
        // 메시지 핸들러가 등록 안 된 상태(예: 이 페이지를 브라우저에서 직접
        // 열어 테스트할 때)일 수 있다 — 무시해도 된다.
      }
    }
    window.addEventListener('error', function (event) {
      var detail = event.message || (event.error && event.error.message) || String(event.error);
      postHwpDebug('window.onerror: ' + detail + ' @ ' + (event.filename || '') + ':' + (event.lineno || '') + ':' + (event.colno || ''));
    });
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      var detail = (reason && reason.message) ? reason.message : String(reason);
      postHwpDebug('unhandledrejection: ' + detail);
    });
  </script>
  <script type="module" src="hwp_viewer.js"></script>
</body>
</html>
